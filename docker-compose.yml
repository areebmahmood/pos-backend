# Local stack: SQL Server + API. Usage: docker compose up --build
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_password123}"
    ports:
      - "1433:1433"
    volumes:
      - pos-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PosDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_password123};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5080:8080"

volumes:
  pos-sql-data:
